name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Run Tests
        run: swift test

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: "Install SQLite"
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev qemu-user
      - name: "Test AVX Runtime Dispatch"
        run: |
          sh Scripts/prepare-sqlite-vec.sh "$PWD/Sources/CSQLiteVec" \
            "$RUNNER_TEMP/sqlite-vec-generated" "$PWD"/Patches/sqlite-vec/*.patch
          clang -O2 -DSQLITE_CORE -DSQLITE_VEC_ENABLE_AVX=1 \
            -I "$RUNNER_TEMP/sqlite-vec-generated" -I Sources/CSQLiteVec \
            Tests/CSQLiteVecTests/AVXRuntimeTests.c -lsqlite3 -lm \
            -o "$RUNNER_TEMP/sqlite-vec-avx-test"
          qemu-x86_64 -cpu Nehalem "$RUNNER_TEMP/sqlite-vec-avx-test" scalar
          qemu-x86_64 -cpu Haswell "$RUNNER_TEMP/sqlite-vec-avx-test" avx
      - name: "Test Swift Package on Linux"
        run: swift test
      - name: "Test Without SQLiteVecAVX on Linux"
        run: swift test --disable-default-traits --traits SQLiteVecNEON,SQLiteVecStaticAPI
      - name: "Build Without SQLiteVecStaticAPI on Linux"
        run: swift build --disable-default-traits --traits SQLiteVecNEON,SQLiteVecAVX

  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: "Install SQLite"
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev
      - name: "Test Swift Package on Linux"
        run: swift test
