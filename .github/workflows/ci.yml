name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Run Tests
        run: swift test

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: "Install SQLite"
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev
      - name: "Test Swift Package on Linux"
        run: swift test
      - name: "Test AVX Trait on Linux"
        run: swift test --traits AVX

  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: "Install SQLite"
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev
      - name: "Test Swift Package on Linux"
        run: swift test
